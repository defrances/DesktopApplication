name: Notify Orchestrator

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    name: Dispatch Orchestrator
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Orchestrator after successful main CI
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ORCHESTRATOR_PAT is not configured in DesktopApplication secrets." >&2
            echo "https://github.com/defrances/DesktopApplication/settings/secrets/actions" >&2
            exit 1
          fi

          sha="${{ github.event.workflow_run.head_sha }}"
          run_id="${{ github.event.workflow_run.id }}"
          html_url="${{ github.event.workflow_run.html_url }}"

          payload=$(jq -n \
            --arg event_type "desktop-application-merged" \
            --arg sha "${sha}" \
            --arg html_url "${html_url}" \
            --arg repository "${{ github.repository }}" \
            --argjson run_id "${run_id}" \
            '{
              event_type: $event_type,
              client_payload: {
                sha: $sha,
                run_id: $run_id,
                html_url: $html_url,
                repository: $repository
              }
            }')

          echo "Notifying defrances/Orchestrator for ${sha} (CI ${run_id})"

          if echo "$payload" | gh api repos/defrances/Orchestrator/dispatches --method POST --input -; then
            echo "Started Orchestrator via repository_dispatch desktop-application-merged"
            echo "https://github.com/defrances/Orchestrator/actions"
            exit 0
          fi

          echo "repository_dispatch failed; trying workflow_dispatch on Orchestrator"

          if gh workflow run orchestrate.yml \
            --repo defrances/Orchestrator \
            -f "sha=${sha}" \
            -f "ci_run_id=${run_id}"; then
            echo "Started Orchestrator via workflow_dispatch"
            echo "https://github.com/defrances/Orchestrator/actions"
            exit 0
          fi

          echo "Could not start a run in defrances/Orchestrator." >&2
          echo "Edit the existing fine-grained PAT (same token value is fine) and grant:" >&2
          echo "  defrances/Orchestrator  Contents: Read and write   (repository_dispatch)" >&2
          echo "  defrances/Orchestrator  Actions: Read and write    (workflow_dispatch)" >&2
          echo "https://github.com/settings/personal-access-tokens" >&2
          exit 1
